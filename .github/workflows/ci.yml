name: CI

on:
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    base-image-policy:
        name: Validate ServerSideUp base image
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Verify PHP runtime alignment
              run: .github/scripts/verify-php-runtime-alignment.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Verify pinned ServerSideUp provenance
              env:
                  GH_TOKEN: ${{ github.token }}
              run: .github/scripts/verify-serversideup-base.sh

            - name: Install checksum-verified Trivy
              env:
                  TRIVY_VERSION: 0.72.0
              run: |
                  case "$RUNNER_ARCH" in
                    X64)
                      archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
                      checksum=bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
                      ;;
                    ARM64)
                      archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
                      checksum=2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467
                      ;;
                    *)
                      echo "Unsupported runner architecture: $RUNNER_ARCH" >&2
                      exit 1
                      ;;
                  esac

                  archive_path="$RUNNER_TEMP/$archive"
                  curl --fail --silent --show-error --location \
                    --retry 3 --retry-all-errors \
                    "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
                    --output "$archive_path"
                  printf '%s  %s\n' "$checksum" "$archive_path" | sha256sum --check -
                  tar -xzf "$archive_path" -C "$RUNNER_TEMP" trivy
                  echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
                  "$RUNNER_TEMP/trivy" --version

            - name: Reject newly introduced fixable HIGH/CRITICAL vulnerabilities
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  GH_TOKEN: ${{ github.token }}
                  TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
              run: .github/scripts/compare-base-vulnerabilities.sh

    php:
        name: PHP (Pint + Pest)
        runs-on: ubuntu-24.04
        container:
            image: serversideup/php:8.5.9-frankenphp@sha256:c8e9d95cd6b83180662f63de646937f3b304041ac4edfbd95ff8bd684467d035
            options: --user root

        defaults:
            run:
                shell: bash

        steps:
            - name: Install CI system and PHP dependencies
              env:
                  DEBIAN_FRONTEND: noninteractive
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends git
                  rm -rf /var/lib/apt/lists/*
                  install-php-extensions bcmath intl sockets

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Reject production env secrets in workflows
              run: |
                  forbidden='ENV_FILE_'
                  if git grep -n "${forbidden}BASE64" -- .github/workflows; then
                      echo '::error::Production runtime environments must never be CI build inputs.'
                      exit 1
                  fi

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - name: Verify Composer platform requirements
              run: |
                  test "$(php -r 'echo PHP_VERSION;')" = "$(composer config platform.php)"
                  composer check-platform-reqs --lock

            - name: Prepare Laravel environment
              run: |
                  cp .env.example .env
                  php artisan key:generate --force --ansi

            - name: Run Pint
              run: vendor/bin/pint --test --format agent

            - name: Run Pest tests
              run: php artisan test --compact --testsuite=Unit,Feature,Arch

    demo-reset-integration:
        name: Demo reset (PostgreSQL 18 + Typesense 30.2)
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        services:
            postgres:
                image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
                env:
                    POSTGRES_PASSWORD: secret
                    POSTGRES_DB: pingcrm_integration
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d pingcrm_integration"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            RUN_DEMO_RESET_INTEGRATION: 'true'
            APP_ENV: testing
            APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
            CACHE_STORE: array
            QUEUE_CONNECTION: sync
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: '5432'
            DB_DATABASE: pingcrm_integration
            DB_USERNAME: postgres
            DB_PASSWORD: secret
            SCOUT_DRIVER: typesense
            SCOUT_QUEUE: 'false'
            TYPESENSE_API_KEY: integration-key
            TYPESENSE_HOST: 127.0.0.1
            TYPESENSE_PORT: '8108'
            TYPESENSE_PROTOCOL: http

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, bcmath, intl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - name: Start digest-pinned Typesense
              run: |
                  docker run --detach --rm \
                    --name pingcrm-typesense-integration \
                    --tmpfs /data \
                    --publish 8108:8108 \
                    typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110 \
                    --data-dir=/data \
                    --api-key="$TYPESENSE_API_KEY"

                  for _attempt in {1..30}; do
                    if curl --fail --silent http://127.0.0.1:8108/health; then
                      exit 0
                    fi
                    sleep 1
                  done

                  docker logs pingcrm-typesense-integration
                  exit 1

            - name: Run PostgreSQL and Typesense integration tests
              run: php artisan test --compact --testsuite=Integration

            - name: Stop Typesense
              if: always()
              run: docker stop pingcrm-typesense-integration || true

    browser:
        name: Browser (Pest 4)
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, bcmath, intl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Prepare Laravel environment (Wayfinder needs a booted app)
              run: |
                  cp .env.example .env
                  php artisan key:generate --force --ansi

            - name: Build Vite assets
              run: vp run build

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run Browser tests
              run: php artisan test --compact --testsuite=Browser

    frontend:
        name: Frontend (Types + Lint + Format)
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, bcmath, intl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Prepare Laravel environment (Wayfinder needs a booted app + DB schema)
              # .env.example points at PostgreSQL which is not available in CI, so
              # override to SQLite locally for the tsc/lint/format checks.
              # Production parity (Wayfinder types from PostgreSQL) is enforced in
              # the build workflow.
              run: |
                  cp .env.example .env
                  sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
                  sed -i 's|^DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
                  php artisan key:generate --force --ansi
                  touch database/database.sqlite
                  php artisan migrate --force --ansi

            - name: Generate Wayfinder TypeScript files
              run: php artisan wayfinder:generate --no-interaction

            - name: Type check
              run: vp run types

            - name: Lint check
              run: vp run lint:check

            - name: Format check
              run: vp run format:check

    build:
        name: Build (Vite production bundle)
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, sqlite3, bcmath, intl
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

            - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Prepare Laravel environment (Wayfinder needs a booted app)
              run: |
                  cp .env.example .env
                  php artisan key:generate --force --ansi

            - name: Build production bundle
              run: vp run build

    production-image:
        name: Validate production image
        runs-on: ${{ vars.SYSTEM_ARCH == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
        timeout-minutes: 30

        services:
            postgres:
                image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
                env:
                    POSTGRES_PASSWORD: secret
                    POSTGRES_DB: pingcrm_image_smoke
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U postgres -d pingcrm_image_smoke"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: '5432'
            DB_DATABASE: pingcrm_image_smoke
            DB_USERNAME: postgres
            DB_PASSWORD: secret

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_pgsql, bcmath, intl
                  coverage: none
                  tools: composer:v2

            - name: Install production Composer dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: '--no-dev'
                  ignore-cache: '1'

            - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
              with:
                  node-version-file: .node-version
                  cache: true

            - name: Prepare isolated PostgreSQL environment and assets
              env:
                  APP_ENV: production
                  APP_DEBUG: 'false'
                  CACHE_STORE: array
                  SESSION_DRIVER: array
                  QUEUE_CONNECTION: sync
                  MAIL_MAILER: log
              run: |
                  umask 077
                  cp .env.example .env
                  php artisan key:generate --force --ansi
                  php artisan migrate --force --no-interaction
                  vp install --frozen-lockfile
                  vp run build:ssr

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

            - name: Build production image locally
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  target: app
                  load: true
                  tags: pingcrm-image-smoke:${{ github.sha }}
                  provenance: false
                  sbom: false

            - name: Smoke-test production image
              env:
                  EXPECTED_ARCHITECTURE: ${{ vars.SYSTEM_ARCH == 'aarch64' && 'arm64' || 'amd64' }}
              run: .github/scripts/smoke-production-image.sh pingcrm-image-smoke:${{ github.sha }}

    zizmor:
        name: zizmor (audit workflows)
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            # Le SHA de zizmor-action fige à la fois l'action et le digest
            # de la version Zizmor « latest » recensée dans support/versions.
            # Ne pas surcharger version : les mises à jour Renovate font ainsi
            # évoluer l'action et son moteur atomiquement. Bloquant via
            # annotations + exit codes ; le mode SARIF (advanced-security) ne
            # fait jamais échouer le job.
            - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
              with:
                persona: regular
                advanced-security: false
                annotations: true
