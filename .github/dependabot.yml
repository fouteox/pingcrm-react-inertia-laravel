# Déclare à Dependabot que ce dossier est géré par Bun. Sans cette entrée, il
# traitait bun.lock avec npm_and_yarn, qui ne sait pas le mettre à jour, et
# ses jobs de sécurité échouaient.
# Dependabot ne fait aucune mise à jour de sécurité pour Bun : les PR de
# sécurité JavaScript viennent de Renovate (profil apps de
# fouteox/renovate-runner), comme ses mises à jour de version. La limite à 0
# coupe donc aussi les PR de version de Dependabot.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Ne vaut que pour les mises à jour de version, coupées ici. zizmor exige
    # au moins sept jours ; c'est plus strict que la carence de trois jours de
    # Renovate et de bunfig.toml.
    cooldown:
      default-days: 7
